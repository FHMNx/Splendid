# DUMMY CREDENTIALS FOR TESTING CONTEXT ONLY
jwt.secret=dummy-test-secret-key-that-is-long-enough-for-hs256
sendgrid.api.key=dummy-sendgrid-key

cloudinary.cloud-name=dummy-cloud
cloudinary.api-key=dummy-key
cloudinary.api-secret=dummy-secret

payhere.merchant.id=dummy-id
payhere.merchant.secret=dummy-secret

# ---------------------------------------------------------
# H2 IN-MEMORY DATABASE FOR ISOLATED TESTING
# ---------------------------------------------------------
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Create a fresh database schema every time tests run
spring.jpa.hibernate.ddl-auto=create-drop

app.logo.url=https://dummy-url.com/logo.png
spring.datasource.url=jdbc:h2:mem:splendid_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=MONTH,YEAR