server {
    listen 80;
    
    # This tells Nginx exactly where Docker put your React files
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This is the magic line that allows React Router to handle URLs without throwing 404s
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets so your site loads blazing fast
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}